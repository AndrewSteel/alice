# alice_timer_melody.yaml — PROJ-85 Timer-Agent melody mediator
#
# Alice's timer watcher (alice-chat-stream) plays the expiry melody on ALL
# Voice PE at once by calling this package's scripts over HA's REST API —
# start on expiry, stop when the alarm is acknowledged (Refinement
# 2026-10-15: the alarm belongs to the house, not to the setting device).
# The speaker list comes from Alice (every `media_player` in the speech
# gateway's device-mapping.yaml); a new device needs no change here.
#
# "Stop on wake" deliberately does NOT live in HA: "Hey Jarvis" bypasses HA's
# Assist pipeline entirely and streams straight to alice-speech-gateway over
# raw Wyoming (PROJ-42) — confirmed at the device 2026-09-16, HA's
# assist_satellite entity never changes state for it. The gateway is the only
# place that knows a new turn just began, so it stops the melody itself via
# GET /stream/timers/pending on alice-chat-stream (see
# GatewayWyomingHandler._announce_expired_timers in wyoming_transport.py),
# which calls TimerScheduler.stop_melody() -> script.alice_timer_melody_stop
# below. Closing the WebApp toast and deleting a ringing timer do the same.
#
# One offline speaker must not block the others: every per-player call runs
# with continue_on_error. >>> HARDWARE-VERIFY with two devices (spec §H5).
#
# Verified at the device (2026-09-16, single player): start/loop, timeout
# self-stop, and manual stop all work end-to-end with a real media_player
# entity and a media-source:// file (see input_text.alice_timer_melody_url).
#
# Install: copy into HA's packages/ dir (requires
# `homeassistant: packages: !include_dir_named packages` in
# configuration.yaml) and restart HA. Requires the helper entities below.

# --- Helper entities -------------------------------------------------------
input_boolean:
  alice_timer_melody_active:
    name: Alice Timer-Melodie aktiv
    icon: mdi:timer-alert

input_text:
  # Comma-separated media_player list of the running session. 255 chars
  # fit about 5-6 Voice PE entity ids — extend (or shorten the ids) beyond.
  alice_timer_melody_player:
    name: Alice Timer-Melodie Player
    max: 255
  alice_timer_melody_url:
    name: Alice Timer-Melodie URL
    max: 255
    # Short, gentle tone (2-4 s), placed at the root of HA's media volume
    # (/media/alice_timer_finished.mp3). media-source://media_source/local/
    # maps to that root; adjust the filename here if it changes.
    initial: media-source://media_source/local/alice_timer_finished.mp3

input_number:
  alice_timer_melody_max_seconds:
    name: Alice Timer-Melodie Maximaldauer
    min: 10
    max: 600
    step: 5
    initial: 120
    unit_of_measurement: s

# --- Scripts Alice calls over REST ---------------------------------------
script:
  alice_timer_melody_start:
    alias: Alice Timer-Melodie starten
    # restart, not the default single: after a stop the loop keeps running
    # until its current delay ends (<= 6 s); a new expiry in that window must
    # restart the melody instead of being dropped as "already running".
    mode: restart
    # Called as: POST /api/services/script/turn_on
    #   { "entity_id": "script.alice_timer_melody_start",
    #     "variables": { "media_players": "media_player.a,media_player.b",
    #                    "max_seconds": 120 } }
    fields:
      media_players:
        description: comma-separated media_player entities of all Voice PE
      max_seconds:
        description: self-stop after this many seconds
    sequence:
      - variables:
          players: "{{ media_players.split(',') | map('trim') | reject('eq', '') | list }}"
          maxsec: "{{ max_seconds | default(120) }}"
      - service: input_text.set_value
        target: { entity_id: input_text.alice_timer_melody_player }
        data: { value: "{{ players | join(',') }}" }
      - service: input_number.set_value
        target: { entity_id: input_number.alice_timer_melody_max_seconds }
        data: { value: "{{ maxsec }}" }
      # One house-wide session: if a melody is already playing, keep it — a
      # timer coming due meanwhile attaches to the same session instead of
      # starting a second tone (spec collect window, global).
      - if:
          - condition: state
            entity_id: input_boolean.alice_timer_melody_active
            state: "off"
        then:
          - service: input_boolean.turn_on
            target: { entity_id: input_boolean.alice_timer_melody_active }
          - repeat:
              for_each: "{{ players }}"
              sequence:
                - service: media_player.volume_set
                  continue_on_error: true
                  target: { entity_id: "{{ repeat.item }}" }
                  data: { volume_level: 0.6 }
          - repeat:
              # Loop the tone on every speaker until the "melody active" flag
              # is cleared (by the stop script — called from alice-chat-stream
              # on acknowledgement / delete, or by the timeout automation).
              while:
                - condition: state
                  entity_id: input_boolean.alice_timer_melody_active
                  state: "on"
              sequence:
                # media_player.play_media accepts a media-source:// id directly
                # — the integration resolves it itself.
                - repeat:
                    for_each: "{{ players }}"
                    sequence:
                      - service: media_player.play_media
                        continue_on_error: true
                        target: { entity_id: "{{ repeat.item }}" }
                        data:
                          media_content_id: "{{ states('input_text.alice_timer_melody_url') }}"
                          media_content_type: music
                - delay: { seconds: 6 }

  alice_timer_melody_stop:
    alias: Alice Timer-Melodie stoppen
    # Called by alice-chat-stream when the alarm is acknowledged (any Voice PE
    # addressed, WebApp toast closed), on delete-during-alarm, and by the
    # timeout automation below (then without variables: the stored list).
    fields:
      media_players:
        description: comma-separated media_player entities (default the session's list)
    sequence:
      - variables:
          players: >-
            {{ (media_players | default(states('input_text.alice_timer_melody_player'), true))
               .split(',') | map('trim') | reject('eq', '') | list }}
      - service: input_boolean.turn_off
        target: { entity_id: input_boolean.alice_timer_melody_active }
      - repeat:
          for_each: "{{ players }}"
          sequence:
            - service: media_player.media_stop
              continue_on_error: true
              target: { entity_id: "{{ repeat.item }}" }

# --- Automations ---------------------------------------------------------
automation:
  - alias: Alice Timer-Melodie – Selbst-Stopp nach Maximaldauer
    id: alice_timer_melody_timeout
    triggers:
      - trigger: state
        entity_id: input_boolean.alice_timer_melody_active
        to: "on"
        for:
          seconds: "{{ states('input_number.alice_timer_melody_max_seconds') | int(120) }}"
    conditions:
      - condition: state
        entity_id: input_boolean.alice_timer_melody_active
        state: "on"
    actions:
      - service: script.alice_timer_melody_stop
