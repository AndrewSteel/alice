# alice_timer_melody.yaml — PROJ-85 Timer-Agent melody mediator
#
# Alice's timer watcher (alice-chat-stream) plays the expiry melody on the
# Voice PE by calling this package's scripts over HA's REST API — start on
# expiry, stop on delete-during-alarm.
#
# "Stop on wake" deliberately does NOT live in HA: "Hey Jarvis" bypasses HA's
# Assist pipeline entirely and streams straight to alice-speech-gateway over
# raw Wyoming (PROJ-42) — confirmed at the device 2026-09-16, HA's
# assist_satellite entity never changes state for it. The gateway is the only
# place that knows a new turn just began, so it stops the melody itself via
# GET /stream/timers/pending on alice-chat-stream (see
# GatewayWyomingHandler._announce_expired_timers in wyoming_transport.py),
# which calls TimerScheduler.stop_melody() -> script.alice_timer_melody_stop
# below, same as the delete-during-alarm path.
#
# Verified at the device (2026-09-16): start/loop, timeout self-stop, and
# manual stop all work end-to-end with a real media_player entity and a
# media-source:// file (see input_text.alice_timer_melody_url below).
#
# Install: copy into HA's packages/ dir (requires
# `homeassistant: packages: !include_dir_named packages` in
# configuration.yaml) and restart HA. Requires the helper entities below.

# --- Helper entities -------------------------------------------------------
input_boolean:
  alice_timer_melody_active:
    name: Alice Timer-Melodie aktiv
    icon: mdi:timer-alert

input_text:
  alice_timer_melody_player:
    name: Alice Timer-Melodie Player
    max: 255
  alice_timer_melody_url:
    name: Alice Timer-Melodie URL
    max: 255
    # Short, gentle tone (2-4 s), placed at the root of HA's media volume
    # (/media/alice_timer_finished.mp3). media-source://media_source/local/
    # maps to that root; adjust the filename here if it changes.
    initial: media-source://media_source/local/alice_timer_finished.mp3

input_number:
  alice_timer_melody_max_seconds:
    name: Alice Timer-Melodie Maximaldauer
    min: 10
    max: 600
    step: 5
    initial: 120
    unit_of_measurement: s

# --- Scripts Alice calls over REST ---------------------------------------
script:
  alice_timer_melody_start:
    alias: Alice Timer-Melodie starten
    # Called as: POST /api/services/script/turn_on
    #   { "entity_id": "script.alice_timer_melody_start",
    #     "variables": { "media_player": "...", "max_seconds": 120 } }
    fields:
      media_player:
        description: media_player entity of the setting Voice PE
      max_seconds:
        description: self-stop after this many seconds
    sequence:
      - variables:
          player: "{{ media_player }}"
          maxsec: "{{ max_seconds | default(120) }}"
      - service: input_text.set_value
        target: { entity_id: input_text.alice_timer_melody_player }
        data: { value: "{{ player }}" }
      - service: input_number.set_value
        target: { entity_id: input_number.alice_timer_melody_max_seconds }
        data: { value: "{{ maxsec }}" }
      # Bundle window: if a melody is already playing on this device, just keep
      # it — a second timer coming due within a few seconds attaches to the
      # same session instead of starting a new tone (spec collect window).
      - if:
          - condition: state
            entity_id: input_boolean.alice_timer_melody_active
            state: "off"
        then:
          - service: input_boolean.turn_on
            target: { entity_id: input_boolean.alice_timer_melody_active }
          - service: media_player.volume_set
            target: { entity_id: "{{ player }}" }
            data: { volume_level: 0.6 }
          - repeat:
              # Loop the tone until the "melody active" flag is cleared (by the
              # stop script — called either from alice-chat-stream on delete,
              # from alice-speech-gateway at the start of the next turn, or by
              # the timeout automation below).
              while:
                - condition: state
                  entity_id: input_boolean.alice_timer_melody_active
                  state: "on"
              sequence:
                # media_player.play_media accepts a media-source:// id directly
                # — the integration resolves it itself. (An earlier version of
                # this script tried to pre-resolve via a
                # media_source.resolve_media *service*, which does not exist;
                # resolution is an internal call, not a callable action.)
                - service: media_player.play_media
                  target: { entity_id: "{{ player }}" }
                  data:
                    media_content_id: "{{ states('input_text.alice_timer_melody_url') }}"
                    media_content_type: music
                - delay: { seconds: 6 }

  alice_timer_melody_stop:
    alias: Alice Timer-Melodie stoppen
    # Called on "delete during melody", and by alice-speech-gateway at the
    # start of every new turn on this device (see file header).
    sequence:
      - service: input_boolean.turn_off
        target: { entity_id: input_boolean.alice_timer_melody_active }
      - service: media_player.media_stop
        target:
          entity_id: "{{ states('input_text.alice_timer_melody_player') }}"

# --- Automations ---------------------------------------------------------
automation:
  - alias: Alice Timer-Melodie – Selbst-Stopp nach Maximaldauer
    id: alice_timer_melody_timeout
    triggers:
      - trigger: state
        entity_id: input_boolean.alice_timer_melody_active
        to: "on"
        for:
          seconds: "{{ states('input_number.alice_timer_melody_max_seconds') | int(120) }}"
    conditions:
      - condition: state
        entity_id: input_boolean.alice_timer_melody_active
        state: "on"
    actions:
      - service: script.alice_timer_melody_stop
