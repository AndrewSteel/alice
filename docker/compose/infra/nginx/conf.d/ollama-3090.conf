# conf.d/ollama-3090.conf
# PROJ-99: ollama-3090 is retired. This vhost now permanently redirects to the
# llama.cpp router at llama3090.happy-mining.de. External scripts / Jupyter
# notebooks that still call ollama3090.happy-mining.de keep working via this
# 301 during the transition; the target host is documented in README.md so they
# can be moved. Rollback (restore the proxy) is described in the PROJ-99 spec.

server {
  listen 80;
  server_name ollama3090.happy-mining.de;
  return 301 https://llama3090.happy-mining.de$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name ollama3090.happy-mining.de;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/private-key.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;

  return 301 https://llama3090.happy-mining.de$request_uri;
}
