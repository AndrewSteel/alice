# ---------- Globale Helfer ----------
# CORS: nur Domains erlauben die gebraucht werden
map $http_origin $cors_origin {
    default "";
    "~^https?://(alice|ollama3090|ollamatitan|openwebui|n8n)\.happy-mining\.de$" $http_origin;
}

server {
  listen 80;
  server_name alice.happy-mining.de;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name alice.happy-mining.de;

  # TLS
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/private-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  add_header Strict-Transport-Security "max-age=31536000" always;
  include /etc/nginx/snippets/security-headers.conf;

  # Rate-limiting: return 429 instead of default 503
  limit_req_status 429;

  resolver 127.0.0.11 ipv6=off valid=30s;

  # Gemeinsame Proxy-Header, auch für WebSockets
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Authorization     $http_authorization;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        $connection_upgrade;

  set $n8n_upstream http://n8n:5678;

  # ---------- HA-PROD: /v1/* -> n8n /webhook/* ----------
  location ^~ /v1/ {
    # CORS
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Vary Origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    # add_header Access-Control-Allow-Credentials "true" always;
    include /etc/nginx/snippets/security-headers.conf;

    if ($request_method = OPTIONS) {
      return 204;
    }

    # mappe /v1/... -> /webhook/...
    rewrite ^/v1/(.*)$ /webhook/v1/$1 break;
    proxy_pass $n8n_upstream;
    proxy_read_timeout 3600s;
  }

  # ---------- HA-TEST: /vtest/* -> n8n /webhook-test/* ----------
  location ^~ /vtest/ {
    # CORS
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Vary Origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    # add_header Access-Control-Allow-Credentials "true" always;
    include /etc/nginx/snippets/security-headers.conf;

    if ($request_method = OPTIONS) {
      return 204;
    }

    # mappe /vtest/... -> /webhook-test/...
    rewrite ^/vtest/(.*)$ /webhook-test/v1/$1 break;
    proxy_pass $n8n_upstream;
    proxy_read_timeout 3600s;
  }

  # ---- Direktdurchreichung: /webhook-test/* -> n8n ----
  location ^~ /webhook-test/ {
    # CORS
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Vary Origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    # add_header Access-Control-Allow-Credentials "true" always;
    include /etc/nginx/snippets/security-headers.conf;

    if ($request_method = OPTIONS) { return 204; }

    proxy_pass $n8n_upstream;
    proxy_read_timeout 3600s;
  }

  # ---- Direktdurchreichung: /webhook/* -> n8n ----
  location ^~ /webhook/ {
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Vary Origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    include /etc/nginx/snippets/security-headers.conf;
    if ($request_method = OPTIONS) { return 204; }

    proxy_pass $n8n_upstream;
    proxy_read_timeout 3600s;
  }

  # ---- /api/auth/* -> alice-auth direkt (kein n8n) ----
  location ^~ /api/auth/ {
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Vary Origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    include /etc/nginx/snippets/security-headers.conf;
    limit_req zone=auth_limit burst=3 nodelay;

    if ($request_method = OPTIONS) { return 204; }

    rewrite ^/api(.*)$ $1 break;
    proxy_pass http://alice-auth:8002;
    proxy_read_timeout 30s;
  }

  # ---- /api/webhook/alice/* -> n8n Session API (no LLM rate limit) ----
  location ^~ /api/webhook/alice/ {
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Vary Origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    include /etc/nginx/snippets/security-headers.conf;
    if ($request_method = OPTIONS) { return 204; }

    rewrite ^/api(.*)$ $1 break;
    proxy_pass $n8n_upstream;
    proxy_read_timeout 30s;
  }

  # ---- /api/webhook/dms/* -> n8n DMS Folder API (GET, POST, PUT, DELETE) ----
  location ^~ /api/webhook/dms/ {
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Vary Origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    include /etc/nginx/snippets/security-headers.conf;
    if ($request_method = OPTIONS) { return 204; }

    rewrite ^/api(.*)$ $1 break;
    proxy_pass $n8n_upstream;
    proxy_read_timeout 30s;
  }

  # ---- /api/stream/* -> alice-chat-stream (SSE; no buffering) ----
  location ^~ /api/stream/ {
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Vary Origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    include /etc/nginx/snippets/security-headers.conf;

    # Rate-limit: 10 req/min/IP, allow short bursts for retries
    limit_req zone=stream_limit burst=5 nodelay;
    error_page 429 = @stream_rate_limited;

    if ($request_method = OPTIONS) { return 204; }

    # HTTP/1.1 with Keep-Alive (override server-block Connection: $connection_upgrade)
    proxy_http_version 1.1;
    proxy_set_header   Connection         "";
    proxy_set_header   Host               $host;
    proxy_set_header   X-Real-IP          $remote_addr;
    proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto  $scheme;
    proxy_set_header   Authorization      $http_authorization;

    # SSE requirements: no buffering, no caching
    proxy_buffering    off;
    proxy_cache        off;
    chunked_transfer_encoding on;
    add_header         X-Accel-Buffering  no always;

    # Long-lived streaming connections
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Forward client disconnects to upstream so the Python service can stop the Ollama stream
    proxy_ignore_client_abort off;

    # Strip /api prefix: /api/stream/chat -> /stream/chat
    rewrite ^/api(.*)$ $1 break;
    proxy_pass http://alice-chat-stream:8003;
  }

  # ---- /api/webhook/* -> n8n (strips /api prefix) ----
  location ^~ /api/webhook/ {
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Vary Origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    include /etc/nginx/snippets/security-headers.conf;
    limit_req zone=chat_limit burst=5 nodelay;
    if ($request_method = OPTIONS) { return 204; }

    rewrite ^/api(.*)$ $1 break;
    proxy_pass $n8n_upstream;
    proxy_read_timeout 3600s;
  }

  # ---- /api/speech/* -> alice-speech-gateway (WebSocket; no buffering) ----
  location ^~ /api/speech/ {
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Vary Origin always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    include /etc/nginx/snippets/security-headers.conf;

    if ($request_method = OPTIONS) { return 204; }

    # WebSocket upgrade
    proxy_http_version 1.1;
    proxy_set_header   Upgrade            $http_upgrade;
    proxy_set_header   Connection         $connection_upgrade;
    proxy_set_header   Host               $host;
    proxy_set_header   X-Real-IP          $remote_addr;
    proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto  $scheme;
    proxy_set_header   Authorization      $http_authorization;

    # Streaming audio: no buffering, long-lived connection
    proxy_buffering    off;
    proxy_cache        off;
    add_header         X-Accel-Buffering  no always;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Strip /api prefix: /api/speech/ws/voice -> /ws/voice
    rewrite ^/api/speech(/.*)$ $1 break;
    proxy_pass http://alice-speech-gateway:10301;
  }

  # ---- Direktdurchreichung: /webhook-waiting/* -> n8n ----
  location ^~ /webhook-waiting/ {
    # CORS
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Vary Origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    # add_header Access-Control-Allow-Credentials "true" always;
    include /etc/nginx/snippets/security-headers.conf;

    if ($request_method = OPTIONS) { return 204; }

    proxy_pass $n8n_upstream;
    proxy_read_timeout 3600s;
  }

  # ---- 429 für /api/stream/ mit Retry-After-Header ----
  location @stream_rate_limited {
    add_header Content-Type "text/plain" always;
    add_header Retry-After  60          always;
    return 429 "Too Many Requests\n";
  }

  # Optional: statische Seite
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri.html $uri/ /index.html;
  }
}
