# infra/nginx/conf.d/grafana.conf
#
# PROJ-77: same-origin HTTPS front for Grafana so the admin Dashboard's
# iframe embeds don't hit mixed-content blocking (Alice is HTTPS-only;
# Grafana on grafana.lan is plain HTTP). Deliberately does NOT include
# security-headers.conf — that snippet sets X-Frame-Options: DENY, which
# would re-block the very embedding this proxy exists for.
#
# Grafana itself needs `root_url = https://grafana.happy-mining.de/` (no
# `serve_from_sub_path` — this is a full subdomain, not a sub-path, so
# Grafana's own routing is untouched and http://grafana.lan:3000 keeps
# working exactly as before).
server {
  listen 80;
  server_name grafana.happy-mining.de;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl;
  http2 on;
  server_name grafana.happy-mining.de;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/private-key.pem;
  include /etc/nginx/snippets/ssl-opts.conf;

  resolver 127.0.0.11 ipv6=off valid=30s;

  # Host MUST be forwarded explicitly — nginx's default (unset) Host header
  # on a proxied request is $proxy_host (the proxy_pass target, i.e.
  # "grafana.lan:3000"), not what the browser actually requested. Grafana's
  # own origin/CSRF validation compares the browser's Origin header against
  # the request's Host — without this line that check sees Host:
  # grafana.lan:3000 vs. Origin: https://grafana.happy-mining.de, a
  # mismatch, and rejects panel data requests with "origin not allowed".
  proxy_set_header Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  set $grafana_upstream http://grafana.lan:3000;

  location / {
    proxy_pass $grafana_upstream;
    proxy_read_timeout 30s;
  }
}
