# Rate-limiting zone for chat endpoint (http context)
# 20 requests per minute per IP address, 10MB shared memory
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=20r/m;

# Rate-limiting zone for SSE streaming endpoint
# SSE connections are long-lived (one connection per chat answer);
# 10 req/min/IP is plenty for normal chat but blocks abuse
limit_req_zone $binary_remote_addr zone=stream_limit:10m rate=10r/m;

# Rate-limiting zone for the PROJ-85 timer endpoints (alice-chat-stream, but a
# separate budget from the chat SSE stream so the WebApp timer-alarm poll and
# the speech-gateway pending-poll don't eat into chat's 10r/m).
limit_req_zone $binary_remote_addr zone=timer_limit:10m rate=60r/m;

# Rate-limiting zone for auth endpoints (POST only)
# Only count POST requests; GET/OPTIONS requests are excluded
map $request_method $auth_limit_key {
    POST    $binary_remote_addr;
    default "";
}
# 5 login attempts per minute per IP, 10MB shared memory
limit_req_zone $auth_limit_key zone=auth_limit:10m rate=5r/m;
