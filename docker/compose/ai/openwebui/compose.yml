services:
  openwebui:
    build: .
    container_name: openwebui
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    env_file:
      - .env
    environment:
      # PROJ-99: llama.cpp router speaks the OpenAI API, not Ollama's.
      - ENABLE_OLLAMA_API=false
      - ENABLE_OPENAI_API=true
      - OPENAI_API_BASE_URL=http://llama-3090:11434/v1
      # Bearer token for the llama.cpp router (--api-key-file). Set in .env.
      - OPENAI_API_KEY=${OLLAMA_API_KEY:-}
      # Zeitzone & Basis-Setup
      - TZ=Europe/Berlin
      # (Optional) Name/Branding der Weboberfläche
      - WEBUI_NAME=OpenWebUI
    volumes:
      # Persistente App-Daten (User, Chats, RAG, Settings)
      - /srv/warm/openwebui:/app/backend/data
    restart: unless-stopped
    networks:
      - frontend

networks:
  frontend:
    external: true
    name: frontend
