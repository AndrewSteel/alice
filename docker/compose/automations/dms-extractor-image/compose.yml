services:
  dms-extractor-image:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dms-extractor-image
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    extends:
      file: ../nas-volumes.yml
      service: nas-base
    env_file:
      - .env
    # PROJ-112: one image at a time. Measured peaks: 200 MP JPEG ~80 MB (draft decode),
    # 250 MP RGB PNG ~1.1 GB, 250 MP RGBA PNG ~2.0 GB (worst case) -> 3 GB with headroom
    mem_limit: 3g
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import time; t=int(open('/tmp/heartbeat').read()); exit(0 if time.time()*1000-t<90000 else 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      backend:
        aliases: [dms-extractor-image]

networks:
  backend:
    external: true
    name: backend
