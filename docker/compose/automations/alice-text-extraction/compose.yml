# ---------------------------------------------------------------------------
# alice-text-extraction — stage `extract` of the new ETL (PROJ-117).
#
# Takes due work of kind `document` from the source register, reads the originals
# via the shared NAS shares (nas-volumes.yml, NAS account, no root; only read),
# extracts the full text (PDF text layer + OCR per page, LibreOffice for all
# Office / OpenDocument formats) and writes it ONLY through alice-source-registry.
# No LLM, no Redis, no MQTT: the old dms-extractor-* containers stay untouched.
#
# Internal interface on port 8014 (health, status), reachable only inside the
# Docker network: there is deliberately NO nginx route.
# ---------------------------------------------------------------------------
services:
  alice-text-extraction:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alice-text-extraction
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    extends:
      file: ../nas-volumes.yml
      service: nas-base
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; print(urllib.request.urlopen(''http://localhost:8014/health'', timeout=3).read().decode())" || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      automation:
        aliases: [alice-text-extraction]
      backend:
        aliases: [alice-text-extraction]

networks:
  backend:
    external: true
    name: backend
  automation:
    external: true
    name: automation
