# Source IP -> Device mapping for Wyoming / HA Voice devices (PROJ-40 / PROJ-42).
#
# The Wyoming protocol does not carry a device identifier. The client IP
# of the TCP connection is used instead — each ESPHome satellite must have
# a fixed IP (DHCP reservation in the router). If the IP changes, the
# device gets the spoken error "Dieses Gerät ist nicht bei Alice registriert".
#
# Adding a device is config-only — no code change. Add one block here and a
# matching ESPHome YAML under devices/<device-name>/espHome.yaml, then
# restart the gateway (changes are read at startup).
#
# Deploy to the Docker volume:
#   /srv/compose/automations/alice-speech-gateway/config/device-mapping.yaml
#
# Fields per entry:
#   user_id  (required)  must match an existing alice.users.id (UUID)
#   name     (optional)  human-readable device name (used in logs / future UI)
#   room     (optional)  room label (reserved for PROJ-43 speaker context)

devices:
  "192.168.178.146":
    user_id: "574fe894-9f54-4959-97c4-f018ad5b74bb"
    name: "Büro HA Voice PE"
    room: "Büro"
