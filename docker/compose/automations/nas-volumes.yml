# Central NAS volume mounts for all DMS containers.
# Edit THIS file when adding/removing NAS mount points.
# Referenced via `extends: file: ../nas-volumes.yml` in each compose.yml.
services:
  nas-base:
    user: "1031:100" # ki-server NAS account — read ACL on all shares below
    volumes:
      - /mnt/nas/ai:/mnt/nas/ai:ro
      - /mnt/nas/andreas:/mnt/nas/andreas:ro
      - /mnt/nas/lilly:/mnt/nas/lilly:ro
      - /mnt/nas/family:/mnt/nas/family:ro
      - /mnt/nas/media:/mnt/nas/media:ro
      - /mnt/nas/photo:/mnt/nas/photo:ro
      - /mnt/nas/pictures:/mnt/nas/pictures:ro
      - /mnt/nas/public:/mnt/nas/public:ro
      - /mnt/nas/scanner:/mnt/nas/scanner:ro
      - /mnt/nas/templates:/mnt/nas/templates:ro
