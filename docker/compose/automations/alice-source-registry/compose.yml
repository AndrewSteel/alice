# ---------------------------------------------------------------------------
# alice-source-registry — source-of-truth repo + source register (PROJ-115).
#
# Keeps the git-versioned markdown folder on the NAS (one file per source) and
# the source register in PostgreSQL consistent. Internal HTTP interface for the
# ETL stages (PROJ-116 ff.) on port 8012, reachable only inside the Docker
# network: there is deliberately NO nginx route.
#
# SOT_REPO_PATH must point to an existing, writable, empty folder on the NAS
# (first start) or an existing source-of-truth repo. The service never creates it
# itself, so a missing NAS mount never leads to a fresh repo in the empty mount
# point. NAS access comes from nas-base (NAS account UID): root is squashed by
# NFS, so a bind mount of a sub-folder would fail.
# ---------------------------------------------------------------------------
services:
  alice-source-registry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alice-source-registry
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    extends:
      file: ../nas-volumes.yml
      service: nas-base
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8012/health'', timeout=3)" || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      automation:
        aliases: [alice-source-registry]
      backend:
        aliases: [alice-source-registry]

networks:
  backend:
    external: true
    name: backend
  automation:
    external: true
    name: automation
