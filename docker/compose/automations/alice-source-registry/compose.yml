# ---------------------------------------------------------------------------
# alice-source-registry — source-of-truth repo + source register (PROJ-115).
#
# Keeps the git-versioned markdown folder on the NAS (one file per source) and
# the source register in PostgreSQL consistent. Internal HTTP interface for the
# ETL stages (PROJ-116 ff.) on port 8012, reachable only inside the Docker
# network: there is deliberately NO nginx route.
#
# The source-of-truth repo lives on its OWN NAS share (PROJ-116), mounted as a
# whole share (no sub-folder: NFS root squash) and only by this service — it is
# not part of nas-volumes.yml, so the DMS containers and the file detection never
# see it. The service runs as the NAS account (SOT_UID_GID).
#
# SOT_REPO_PATH points to a sub-folder inside that share, e.g.
# /mnt/nas/sot/source-of-truth. It must exist (empty on first start) or be an
# existing source-of-truth repo. The service never creates it itself, so a
# missing NAS mount (empty mount point) never leads to a fresh repo.
# ---------------------------------------------------------------------------
services:
  alice-source-registry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alice-source-registry
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    user: "${SOT_UID_GID:-1000:100}"
    volumes:
      - ${SOT_SHARE:-/mnt/nas/sot}:/mnt/nas/sot:rw
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8012/health'', timeout=3)" || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      automation:
        aliases: [alice-source-registry]
      backend:
        aliases: [alice-source-registry]

networks:
  backend:
    external: true
    name: backend
  automation:
    external: true
    name: automation
