services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    environment:
      # ki-server (UID 1031) has no /etc/passwd entry in the container, so
      # $HOME can't be resolved automatically — n8n would otherwise try to
      # write its state under / instead of the mounted volume below.
      - HOME=/home/node
      - N8N_USER_FOLDER=/home/node
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_SECURE_COOKIE=false
      # Interval-based Schedule Triggers (Days/Weeks/Months) run in this timezone;
      # Cron-expression triggers still run in the container's system timezone (UTC).
      - GENERIC_TIMEZONE=Europe/Berlin
      - N8N_METRICS=true
      - N8N_METRICS_INCLUDE_MESSAGE_EVENT_BUS_METRICS=true
      - N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL=true
      - N8N_METRICS_QUEUE_METRICS_INTERVAL=15
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_RUNNERS_TASK_TIMEOUT=3600
      # PROJ-72 follow-up: task runner OOM/disconnects under concurrent Path-Worker load (2026-07-29)
      - N8N_RUNNERS_MAX_OLD_SPACE_SIZE=4096
      # PROJ-72 follow-up: persistent file logging (was console-only, not reviewable after the fact)
      - N8N_LOG_OUTPUT=file
      - N8N_LOG_LEVEL=info
      - N8N_LOG_FILE_LOCATION=/home/node/.n8n/logs/n8n.log
      - N8N_LOG_FILE_SIZE_MAX=50
      - N8N_LOG_FILE_COUNT_MAX=10
      - N8N_DIAGNOSTICS_ENABLED=false
      - QUEUE_HEALTH_CHECK_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${USER}
      - N8N_BASIC_AUTH_PASSWORD=${PASSWORD}
      - WEBHOOK_URL=https://alice.happy-mining.de
      - NODE_FUNCTION_ALLOW_EXTERNAL=axios,redis,winston
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto,fs,path
      # PROJ-1: HA Intent Infrastructure (2026-02-24)
      - INTENT_MIN_CERTAINTY=${INTENT_MIN_CERTAINTY}
      - INTENT_MAX_RESULTS=${INTENT_MAX_RESULTS}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - OLLAMA_URL=${OLLAMA_URL}
      - OLLAMA_MODEL_DMS=${OLLAMA_MODEL_DMS}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      # PROJ-76: image description backfill (same vision model as dms-extractor-image)
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL}
      - WEAVIATE_URL=${WEAVIATE_URL}
      - HA_URL=${HA_URL}
      - HA_TOKEN=${HA_TOKEN}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # PROJ-56 refinement: Geoapify reverse geocoding (2026-07-21)
      - GEOAPIFY_API_KEY=${GEOAPIFY_API_KEY}
      - GEOAPIFY_DAILY_LIMIT=${GEOAPIFY_DAILY_LIMIT}
      # PROJ-7: JWT Auth (2026-02-27)
      # PROJ-36: Change HS256 to RS256 (2026-06-10)
      # - JWT_SECRET="${JWT_SECRET}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    extends:
      file: ../nas-volumes.yml
      service: nas-base
    volumes:
      - /srv/warm/n8n/data:/home/node/.n8n
      - /srv/warm/n8n/cache:/home/node/.cache
      - /srv/warm/n8n/inbox:/data_inbox
    networks:
      frontend:
        aliases: [n8n]
      backend:
        aliases: [n8n]
      automation:
        aliases: [n8n]

networks:
  backend:
    external: true
    name: backend
  frontend:
    external: true
    name: frontend
  automation:
    external: true
    name: automation
