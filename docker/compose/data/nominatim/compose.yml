services:
  nominatim:
    image: mediagis/nominatim:4.4
    container_name: nominatim
    environment:
      # Import mode: nominatim (full) or special-phrase only
      PBF_URL: "https://planet.openstreetmap.org/pbf/planet-latest.osm.pbf"
      REPLICATION_URL: "https://planet.openstreetmap.org/replication/day/"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - /srv/warm/nominatim:/var/lib/postgresql/14/main
    restart: unless-stopped
    # Not exposed externally — internal DMS service only
    networks:
      backend:
        aliases: [nominatim]
    # Healthcheck: verify reverse geocoding endpoint responds
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://localhost:8080/reverse?lat=52.5&lon=13.4&format=json' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 48h

networks:
  backend:
    external: true
    name: backend
