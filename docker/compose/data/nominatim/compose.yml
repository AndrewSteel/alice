services:
  nominatim:
    image: mediagis/nominatim:4.4
    container_name: nominatim
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    environment:
      # Import mode: nominatim (full) or special-phrase only
      PBF_URL: ""
      REPLICATION_URL: "https://planet.openstreetmap.org/replication/day/"
      NOMINATIM_PASSWORD: ""
    volumes:
      - /srv/warm/nominatim:/nominatim/data
    restart: unless-stopped
    # Not exposed externally — internal DMS service only
    networks:
      backend:
        aliases: [nominatim]
    # Healthcheck: verify reverse geocoding endpoint responds
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://localhost:8080/reverse?lat=52.5&lon=13.4&format=json' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s

networks:
  backend:
    external: true
    name: backend
